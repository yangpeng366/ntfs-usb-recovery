[project]
name = "ntfs-usb-recovery"
version = "0.1.0"
description = "Forensic-style NTFS recovery toolbox for Windows disks and USB drives"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Ruff's default rule set (E4/E7/E9 + F).  The scripts in this repo were
# written against the Windows stdlib and are kept close to the originals
# from the field run, so no extra rule families are enabled here.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
