name: ci

# Quality gate for ntfs-usb-recovery.  Every push to main runs the same
# checks that examples\quality-gate.ps1 runs locally, so a green run here
# and a green local run mean the same thing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: python -m pytest tests/ -q

      - name: Encoding sweep (no BOM, UTF-8)
        run: python examples/bom-sweep.py
